<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Search</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 100px;
    }
    input {
      width: 300px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-left: 10px;
    }
    #result {
      margin-top: 40px;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>Genius Search</h1>

  <input type="text" id="query" placeholder="検索ワードを入力">
  <button onclick="search()">検索</button>

  <div id="result"></div>

  <script>
    function search() {
      const q = document.getElementById("query").value.trim(); // ←空白削除
      const result = document.getElementById("result");

      // 空入力チェック
      if (q === "") {
        result.innerText = "検索ワードを入力してください";
        return;
      }

      // 検索中表示
      result.innerText = "検索中...";

      setTimeout(() => {
        result.innerText = `「${q}」に一致する結果は見つかりませんでした`;
      }, 1000);
    }

    // エンターキー対応
    document.getElementById("query").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        search();
      }
    });
  </script>

</body>
</html>
